name: vibecode

# Production stack for srv1029954 — no host port bindings (Traefik handles 80/443).
# Avoids conflicts with: 3000 (soalify), 5432/6379/8080, 18081-18096.
#
# Deploy (pakai cache Docker — default, jangan --no-cache kecuali perlu):
#   docker compose up -d --build
#
# Tanpa rebuild (hanya .env / restart):
#   docker compose up -d
#
# Rebuild paksa tanpa cache (jarang):
#   docker compose build --no-cache && docker compose up -d
#
# Screenshot upload manual disimpan di volume `vibecode_uploads` (mount ke
# /app/public/uploads). JANGAN pakai `docker compose down -v` kecuali sengaja
# hapus data — volume itu yang menyimpan file screenshot.
# Backup: docker run --rm -v vibecode_uploads:/data -v $(pwd):/backup alpine \
#   tar czf /backup/vibecode-uploads-$(date +%F).tgz -C /data .
#
# Local DB only (npm run dev on host):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up postgres -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: vibecode-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vibecatalog}
    volumes:
      - vibecode_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vibecatalog}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vibecode

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${APP_DOMAIN:-vibecode.agungdigitalid.com}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-VibeCatalog.id}
    container_name: vibecode-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      AUTH_URL: https://${APP_DOMAIN:-vibecode.agungdigitalid.com}
      NEXTAUTH_URL: https://${APP_DOMAIN:-vibecode.agungdigitalid.com}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: https://${APP_DOMAIN:-vibecode.agungdigitalid.com}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-VibeCatalog.id}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-VibeCatalog Admin}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      RUN_DB_SEED: ${RUN_DB_SEED:-false}
      THUMIO_API_KEY: ${THUMIO_API_KEY:-}
      AUTH_DEBUG: ${AUTH_DEBUG:-false}
    volumes:
      # Persist manual screenshot uploads across container rebuilds.
      - vibecode_uploads:/app/public/uploads
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}
      # --- General router (all paths) ---
      - traefik.http.routers.vibecode-web.rule=Host(`${APP_DOMAIN:-vibecode.agungdigitalid.com}`)
      - traefik.http.routers.vibecode-web.entrypoints=websecure
      - traefik.http.routers.vibecode-web.tls.certresolver=letsencrypt
      - traefik.http.routers.vibecode-web.middlewares=security-headers@file,rate-limit@file,buffering-limit@file,gzip-compress@file
      - traefik.http.routers.vibecode-web.priority=1
      - traefik.http.services.vibecode-web.loadbalancer.server.port=3000
      # --- Auth router (/api/auth/**) — no buffering-limit, no rate-limit ---
      # buffering-limit can retry requests on timeout; OAuth codes are single-use
      # so a retry causes invalid_grant from Google. Auth routes also must not
      # be rate-limited since the OAuth callback is a one-shot browser redirect.
      - traefik.http.routers.vibecode-auth.rule=Host(`${APP_DOMAIN:-vibecode.agungdigitalid.com}`) && PathPrefix(`/api/auth`)
      - traefik.http.routers.vibecode-auth.entrypoints=websecure
      - traefik.http.routers.vibecode-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.vibecode-auth.middlewares=security-headers@file,gzip-compress@file
      - traefik.http.routers.vibecode-auth.service=vibecode-web
      - traefik.http.routers.vibecode-auth.priority=10
      # --- Media router (/uploads/**, screenshot upload API) — no buffering-limit ---
      # buffering-limit can interfere with multipart POST and large image responses.
      - traefik.http.routers.vibecode-media.rule=Host(`${APP_DOMAIN:-vibecode.agungdigitalid.com}`) && (PathPrefix(`/uploads`) || PathRegexp(`^/api/products/[^/]+/screenshot$`))
      - traefik.http.routers.vibecode-media.entrypoints=websecure
      - traefik.http.routers.vibecode-media.tls.certresolver=letsencrypt
      - traefik.http.routers.vibecode-media.middlewares=security-headers@file,gzip-compress@file
      - traefik.http.routers.vibecode-media.service=vibecode-web
      - traefik.http.routers.vibecode-media.priority=10
      # --- HTTP → HTTPS redirect ---
      - traefik.http.routers.vibecode-web-http.rule=Host(`${APP_DOMAIN:-vibecode.agungdigitalid.com}`)
      - traefik.http.routers.vibecode-web-http.entrypoints=web
      - traefik.http.routers.vibecode-web-http.middlewares=redirect-to-https@docker
    networks:
      - vibecode
      - traefik-public

networks:
  vibecode:
    name: vibecode
  traefik-public:
    external: true

volumes:
  vibecode_pgdata:
    name: vibecode_pgdata
  vibecode_uploads:
    name: vibecode_uploads
